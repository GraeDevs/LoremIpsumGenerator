<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Randomized Lorem Ipsum Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 2rem;
            background-color: #f4f4f4;
        }

        h1 {
            color: #333;
        }

        .generator {
            margin-bottom: 1.5rem;
        }

        textarea {
            width: 100%;
            height: 300px;
            padding: 1rem;
            font-size: 1rem;
            line-height: 1.6;
            resize: vertical;
        }
    </style>
</head>
<body>

    <h1>Randomized Lorem Ipsum Generator</h1>

    <div class="generator">
        <label for="paragraphs">Number of paragraphs:</label>
        <select id="paragraphs">
            <!-- Dynamically creates options 1 to 10 -->
            <script>
        for (let i = 1; i <= 10; i++) {
          document.write(`<option value="${i}">${i}</option>`);
        }
            </script>
        </select>
        <button onclick="generateLorem()">Generate</button>
    </div>

    <textarea id="output" readonly></textarea>

    <script>
    const words = [
      "lorem", "ipsum", "dolor", "sit", "amet", "consectetur", "adipiscing",
      "elit", "sed", "do", "eiusmod", "tempor", "incididunt", "ut", "labore",
      "et", "dolore", "magna", "aliqua", "ut", "enim", "ad", "minim", "veniam",
      "quis", "nostrud", "exercitation", "ullamco", "laboris", "nisi", "aliquip",
      "ex", "ea", "commodo", "consequat", "duis", "aute", "irure", "in", "reprehenderit",
      "voluptate", "velit", "esse", "cillum", "eu", "fugiat", "nulla", "pariatur",
      "excepteur", "sint", "occaecat", "cupidatat", "non", "proident", "sunt", "culpa",
      "qui", "officia", "deserunt", "mollit", "anim", "id", "est", "laborum"
    ];

    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function generateSentence() {
      const wordCount = getRandomInt(6, 16);
      const sentenceWords = [];
      for (let i = 0; i < wordCount; i++) {
        const word = words[getRandomInt(0, words.length - 1)];
        sentenceWords.push(word);
      }
      let sentence = sentenceWords.join(" ");
      sentence = sentence.charAt(0).toUpperCase() + sentence.slice(1) + ".";
      return sentence;
    }

    function generateParagraph() {
      const sentenceCount = getRandomInt(3, 6);
      const paragraph = [];
      for (let i = 0; i < sentenceCount; i++) {
        paragraph.push(generateSentence());
      }
      return paragraph.join(" ");
    }

    function generateLorem() {
      const count = parseInt(document.getElementById('paragraphs').value);
      const paragraphs = [];
      for (let i = 0; i < count; i++) {
        paragraphs.push(generateParagraph());
      }
      document.getElementById('output').value = paragraphs.join("\n\n");
    }
    </script>

</body>
</html>
